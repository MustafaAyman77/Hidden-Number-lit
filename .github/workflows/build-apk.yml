name: Build & Publish Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Restore Keystore for Release
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from GitHub Secret KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ./my-upload-key.jks
            cp ./my-upload-key.jks ./debug.keystore
            cp ./my-upload-key.jks ~/.android/debug.keystore
            echo "Restored from secret successfully."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Restoring permanent keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./my-upload-key.jks
            cp ./my-upload-key.jks ./debug.keystore
            cp ./my-upload-key.jks ~/.android/debug.keystore
            echo "Keystore restored successfully from repository backup."
          elif [ -f "./my-upload-key.jks" ]; then
            echo "my-upload-key.jks already exists."
            cp ./my-upload-key.jks ./debug.keystore
            cp ./my-upload-key.jks ~/.android/debug.keystore
          else
            echo "Generating fallback keystore..."
            keytool -genkey -v \
              -keystore ./my-upload-key.jks \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Release,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            cp ./my-upload-key.jks ./debug.keystore
            cp ./my-upload-key.jks ~/.android/debug.keystore
          fi

      - name: Build Release APK with Dynamic Version
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_NAME="1.0.${RUN_NUM}"
          VERSION_CODE=$(( 100000 + RUN_NUM ))
          echo "Building Release APK for Version: $VERSION_NAME (Code: $VERSION_CODE)"
          gradle :app:assembleRelease -PversionCode=${VERSION_CODE} -PversionName=${VERSION_NAME} --stacktrace --no-daemon
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
          BUILD_VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}

      - name: Prepare Release APK File and Auto-Update version.json
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          if [ -f "$APK_PATH" ]; then
            echo "Release APK found at $APK_PATH"
            RUN_NUM="${{ github.run_number }}"
            VERSION_TAG="v1.0.${RUN_NUM}"
            VERSION_NAME="1.0.${RUN_NUM}"
            VERSION_CODE=$(( 100000 + RUN_NUM ))
            APK_NAME="HiddenNumber-${VERSION_TAG}.apk"
            
            cp "$APK_PATH" "$APK_NAME"
            
            # Calculate SHA256
            SHA256_HASH=$(sha256sum "$APK_PATH" | awk '{print $1}')
            FILE_SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null || echo "16777216")
            FILE_SIZE_MB=$(echo "scale=1; $FILE_SIZE_BYTES / 1048576" | bc -l 2>/dev/null || echo "16.8")
            REPO_NAME="${{ github.repository }}"
            
            # Write updated version.json cleanly
            printf '{\n  "versionCode": %d,\n  "versionName": "%s",\n  "apkUrl": "https://github.com/%s/releases/download/%s/%s",\n  "size": "%s MB",\n  "releaseNotes": [\n    "تحديث تلقائي فوري برقم الإصدار %s",\n    "تحسينات الأداء ومزامنة الغرف واللعب أونلاين",\n    "تثبيت مباشر وسلس لأحدث حزمة APK"\n  ],\n  "mandatory": false,\n  "sha256": "%s"\n}\n' \
              "$VERSION_CODE" "$VERSION_NAME" "$REPO_NAME" "$VERSION_TAG" "$APK_NAME" "$FILE_SIZE_MB" "$VERSION_TAG" "$SHA256_HASH" > version.json
            
            echo "Generated new version.json successfully"
            cat version.json
          else
            echo "Error: Release APK is missing!"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

      - name: Commit & Push updated version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || (git commit -m "chore(release): auto-update version.json to v1.0.${{ github.run_number }} [skip ci]" && git push origin HEAD:${{ github.ref_name }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Release v1.0.{0}', github.run_number) }}
          body: |
            🚀 **تحديث جديد - لعبة الرقم المخفي (Release Build)**

            - تم بناء وتطبيق التحديث تلقائياً برقم الإصدار `v1.0.${{ github.run_number }}`.
            - اضغط على ملف `HiddenNumber-v1.0.${{ github.run_number }}.apk` أدناه لتنزيله وتثبيته مباشرة.
          files: |
            HiddenNumber-v1.0.${{ github.run_number }}.apk
            app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
